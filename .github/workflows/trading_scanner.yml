name: Trading Scanner

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 9:30 AM ET (EDT, Mar–Nov)
    - cron: '30 14 * * 1-5'   # 9:30 AM ET (EST, Nov–Mar)
  workflow_dispatch:            # allows manual trigger from GitHub Actions UI

# Prevent the 2nd DST cron from cancelling the running job
concurrency:
  group: trading-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10         # simple one-shot run; 10 min is plenty

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run trading scanner
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TMOBILE_NUMBER:     ${{ secrets.TMOBILE_NUMBER }}
        run: python day_trading_scanner.py --top 10
 
